<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 15 - Smart URL Shortener</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #58a6ff;
            --text-color: #c9d1d9;
            --success-color: #238636;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 480px;
            border: 1px solid #30363d;
        }

        h2 {
            text-align: center;
            color: #fff;
            margin-top: 0;
        }

        .accent-text {
            color: var(--accent-color);
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        input[type="url"] {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input[type="url"]:focus {
            border-color: var(--accent-color);
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            border: none;
            border-radius: 6px;
            color: #0d1117;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .result-card {
            margin-top: 1.5rem;
            background: #0d1117;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #30363d;
            display: none;
        }

        .result-link {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.5rem;
        }

        .short-url {
            color: #58a6ff;
            text-decoration: none;
            font-weight: bold;
            word-break: break-all;
        }

        .copy-btn {
            width: auto;
            padding: 5px 10px;
            font-size: 0.8rem;
            background-color: var(--success-color);
            color: white;
        }

        .stats {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #8b949e;
            border-top: 1px solid #30363d;
            padding-top: 0.5rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>URL <span class="accent-text">Shortener</span> 🔗</h2>
    <p style="text-align: center; font-size: 0.85rem; color: #8b949e; margin-bottom: 1.5rem;">Day 15: Building Utility Tools</p>
    
    <div class="input-group">
        <label for="longUrl">Enter Long URL:</label>
        <input type="url" id="longUrl" placeholder="https://example.com/very/long/path/here" required>
    </div>
    
    <button onclick="shortenLink()">Shorten URL</button>

    <div class="result-card" id="resultCard">
        <label>Your Shortened Link:</label>
        <div class="result-link">
            <a href="#" id="shortenedUrl" class="short-url" target="_blank" onclick="trackClick()">harun.dev/sh/xyz123</a>
            <button class="copy-btn" id="copyBtn" onclick="copyToClipboard()">Copy</button>
        </div>
        <div class="stats">
            📊 Total Clicks Tracked: <span id="clickCount" style="color: #fff; font-weight: bold;">0</span>
        </div>
    </div>
</div>

<script>
    let clicks = 0;

    function shortenLink() {
        const longUrl = document.getElementById('longUrl').value;
        if (!longUrl) {
            alert("Please enter a valid URL!");
            return;
        }

        // Random 5-character string logic
        const randomCode = Math.random().toString(36).substring(2, 7);
        const generatedShortUrl = `https://harun.dev/sh/${randomCode}`;

        // UI update
        document.getElementById('shortenedUrl').innerText = generatedShortUrl;
        document.getElementById('shortenedUrl').href = longUrl; 
        document.getElementById('resultCard').style.display = 'block';
        
        // Reset analytics
        clicks = 0;
        document.getElementById('clickCount').innerText = clicks;
        document.getElementById('copyBtn').innerText = "Copy";
        document.getElementById('copyBtn').style.backgroundColor = "var(--success-color)";
    }

    function trackClick() {
        clicks++;
        document.getElementById('clickCount').innerText = clicks;
    }

    function copyToClipboard() {
        const textToCopy = document.getElementById('shortenedUrl').innerText;
        navigator.clipboard.writeText(textToCopy).then(() => {
            const copyBtn = document.getElementById('copyBtn');
            copyBtn.innerText = "Copied! ✓";
            copyBtn.style.backgroundColor = "#1f6feb";
        });
    }
</script>

</body>
</html>
